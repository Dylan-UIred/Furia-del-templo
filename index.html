<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Furia del Templo · Torneo a muerte</title>
<style>
:root{--bg:#050203;--ink:#f3e6d0;--ember:#ff5a1f;--gold:#f2b632;--s:60px;--op:.45;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Impact,"Arial Narrow",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;left:0;top:0;transform-origin:0 0;display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#wrap{position:relative}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;background:#000}
#ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(ellipse at center,rgba(42,3,7,.9),rgba(2,0,1,.97));text-align:center;padding:10px;box-sizing:border-box}
#ov h1{margin:0;font-size:clamp(24px,8vh,50px);letter-spacing:.06em;color:#d9b25a;text-transform:uppercase;text-shadow:3px 3px 0 #3a0004,0 0 22px rgba(200,20,20,.55)}
#ov p{margin:0;font-family:system-ui,sans-serif;font-size:clamp(12px,3.4vh,15px);max-width:56ch;line-height:1.4}
#bt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:94%}
button.m{min-width:140px;min-height:44px;font:inherit;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:#1a0b0d;border:2px solid #8a6a3a;border-radius:4px;touch-action:manipulation}
#bt button:first-child,#sg{background:#7a0f16;border-color:#d9b25a}
#sel{position:absolute;inset:0;z-index:5;display:none;pointer-events:none}
#shead{position:absolute;top:1.5%;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px 12px;pointer-events:auto;flex-wrap:wrap;padding:0 6px}
#shead b{font-size:clamp(16px,5vh,26px);color:#d9b25a;text-transform:uppercase;text-shadow:2px 2px 0 #3a0004}
#sinfo{font-family:system-ui,sans-serif;font-size:clamp(11px,3vh,14px);background:rgba(10,3,4,.8);padding:3px 8px;border-radius:8px;max-width:60%}
.card{position:absolute;top:24%;height:72%;width:15.75%;background:transparent;border:0;pointer-events:auto;touch-action:manipulation}
.grp{position:absolute;display:none;flex-direction:column;align-items:center;gap:4px;opacity:var(--op);z-index:3}
#app.play .grp,#app.editing .grp{display:flex}
.grid{display:grid;grid-template:repeat(3,var(--s))/repeat(3,var(--s))}
.grid i{background:#17171c}
button.sh{width:calc(var(--s)*1.7);height:calc(var(--s)*.5);border-radius:14px 14px 6px 6px;border:0;background:linear-gradient(#5a5a66,#2a2a31);color:#e8e8f0;font:inherit;font-size:calc(var(--s)*.26);touch-action:none}
button.dp,button.fb{font:inherit;touch-action:none;border:0;padding:0;color:#d8d8e0}
button.dp{background:#17171c;font-size:calc(var(--s)*.38);border-radius:8px}
button.fb{border-radius:50%;margin:1px;font-size:calc(var(--s)*.52);color:var(--c);background:radial-gradient(circle at 35% 30%,#4a4a54,#17171c);box-shadow:inset 0 0 0 2px #0006}
.on{filter:brightness(2.2)}
#app.editing .grp{opacity:.9;outline:2px dashed var(--gold);outline-offset:4px}
#app.editing .grp button{pointer-events:none}
#mn{display:none;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font:inherit;font-size:13px;color:#cfcfd6;background:#26262d;border:1px solid #60606c;border-radius:12px;padding:8px 16px;opacity:.55;z-index:3;touch-action:manipulation}
#app.play #mn{display:block}
#mu{position:absolute;left:calc(50% + 62px);bottom:8px;font:inherit;font-size:16px;color:#cfcfd6;background:#26262d;border:1px solid #60606c;border-radius:12px;padding:5px 12px;opacity:.65;z-index:7;touch-action:manipulation}
#ed{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px 10px;flex-wrap:wrap;justify-content:center;background:rgba(10,3,4,.94);border:2px solid var(--gold);border-radius:12px;padding:8px 12px;font-family:system-ui,sans-serif;font-size:13px;z-index:6;max-width:92%;box-sizing:border-box}
#ed input{width:110px;touch-action:auto}
#ed button{font:inherit;font-size:15px;color:var(--ink);background:#2a1517;border:2px solid var(--gold);border-radius:8px;padding:6px 12px}
</style></head>
<body oncontextmenu="return false">
<div id="probe"></div>
<div id="app">
<div id="wrap">
<canvas id="c" width="480" height="240"></canvas>
<div id="ov"><h1 id="t"></h1><p id="s"></p><div id="bt"><button class="m" id="b1"></button><button class="m" id="b2"></button><button class="m" id="b3"></button><button class="m" id="b4"></button></div></div>
<div id="sel"><div id="shead"><button class="m" id="sb">Atrás</button><b>Elige a tu guerrero</b><span id="sinfo"></span><button class="m" id="sg">¡Pelear!</button></div><div id="cards"></div></div>
</div>
<div class="grp" id="dp"><button class="sh" data-k="b">L1 · Guardia</button><div class="grid"><span></span><button class="dp" data-k="u">▲</button><span></span><button class="dp" data-k="l">◀</button><i></i><button class="dp" data-k="r">▶</button><span></span><button class="dp" data-k="d">▼</button><span></span></div></div>
<div class="grp" id="fc"><button class="sh" data-k="b">R1 · Guardia</button><div class="grid"><span></span><button class="fb" data-k="t" style="--c:#3fbf8a">△</button><span></span><button class="fb" data-k="p" style="--c:#d58bc4">□</button><span></span><button class="fb" data-k="o" style="--c:#e0485a">○</button><span></span><button class="fb" data-k="k" style="--c:#5a8fe0">✕</button><span></span></div></div>
<button id="mn">Pausa</button>
<button id="mu" aria-label="Sonido">🔊</button>
<div id="ed"><span>Arrastra los botones para moverlos</span><label>Tamaño <input id="rs" type="range" min="40" max="90"></label><label>Transparencia <input id="ro" type="range" min="15" max="95"></label><button id="rr">Restablecer</button><button id="rc">Cancelar</button><button id="rd">Listo</button></div>
</div>
<script>
'use strict';
/* ===================== CONSTANTES Y DOM ===================== */
const W=800,H=400,G=330,SC=.6;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const c=$('c'),g=c.getContext('2d'),app=$('app'),wrap=$('wrap'),ov=$('ov'),selEl=$('sel'),dpEl=$('dp'),fcEl=$('fc'),edEl=$('ed');
const bs=[$('b1'),$('b2'),$('b3'),$('b4')];
const PLAY=new Set(['intro','fight','ko','pre','fin','fx']);

/* ===================== CONFIGURACIÓN DE CONTROLES ===================== */
const DEF={s:60,o:.45,dx:24,dy:14,fx:24,fy:14};
const RNG={s:[40,90],o:[.15,.95],dx:[0,2000],dy:[0,2000],fx:[0,2000],fy:[0,2000]};
let cfg=Object.assign({},DEF),snap=null,editing=false;
function loadCfg(){
 try{
  const raw=JSON.parse(localStorage.getItem('furiaCtl5')||'null');
  if(raw&&typeof raw==='object')for(const k in DEF){const v=Number(raw[k]);if(Number.isFinite(v))cfg[k]=clamp(v,RNG[k][0],RNG[k][1])}
 }catch(e){}
}
function saveCfg(){try{localStorage.setItem('furiaCtl5',JSON.stringify(cfg))}catch(e){}}
let rotd=false,AW=800,AH=360,ins={t:0,r:0,b:0,l:0};
function applyCfg(){
 const s=cfg.s,gw=s*3,gh=s*3.5+8;
 cfg.dx=clamp(cfg.dx,0,Math.max(0,AW-ins.l-ins.r-gw));
 cfg.fx=clamp(cfg.fx,0,Math.max(0,AW-ins.l-ins.r-gw));
 cfg.dy=clamp(cfg.dy,0,Math.max(0,AH-ins.t-ins.b-gh));
 cfg.fy=clamp(cfg.fy,0,Math.max(0,AH-ins.t-ins.b-gh));
 app.style.setProperty('--s',s+'px');app.style.setProperty('--op',cfg.o);
 dpEl.style.left=(ins.l+cfg.dx)+'px';dpEl.style.bottom=(ins.b+cfg.dy)+'px';
 fcEl.style.right=(ins.r+cfg.fx)+'px';fcEl.style.bottom=(ins.b+cfg.fy)+'px';
 $('rs').value=cfg.s;$('ro').value=Math.round(cfg.o*100);
}
function fit(){
 const iw=innerWidth,ih=innerHeight,cs=getComputedStyle($('probe'));
 const T=parseFloat(cs.paddingTop)||0,R=parseFloat(cs.paddingRight)||0,B=parseFloat(cs.paddingBottom)||0,Lf=parseFloat(cs.paddingLeft)||0;
 rotd=ih>iw;AW=rotd?ih:iw;AH=rotd?iw:ih;
 ins=rotd?{l:T,r:B,t:R,b:Lf}:{t:T,r:R,b:B,l:Lf};
 app.style.width=AW+'px';app.style.height=AH+'px';
 app.style.padding=ins.t+'px '+ins.r+'px '+ins.b+'px '+ins.l+'px';
 app.style.transform=rotd?'translateX('+iw+'px) rotate(90deg)':'none';
 const ww=Math.max(200,Math.min(AW-ins.l-ins.r-8,(AH-ins.t-ins.b-4)*2));
 wrap.style.width=ww+'px';wrap.style.height=ww/2+'px';
 applyCfg();
}
function openEditor(){snap=Object.assign({},cfg);editing=true;app.classList.add('editing');ov.style.display='none';edEl.style.display='flex'}
function closeEditor(save){
 if(save)saveCfg();else if(snap){Object.assign(cfg,snap);applyCfg()}
 editing=false;app.classList.remove('editing');edEl.style.display='none';menu();
}
$('rs').oninput=e=>{cfg.s=clamp(+e.target.value||DEF.s,40,90);applyCfg()};
$('ro').oninput=e=>{cfg.o=clamp((+e.target.value||45)/100,.15,.95);applyCfg()};
$('rr').onclick=()=>{Object.assign(cfg,DEF);applyCfg()};
$('rc').onclick=()=>closeEditor(false);
$('rd').onclick=()=>closeEditor(true);

/* ===================== ENTRADA (TECLADO + MULTITOUCH) ===================== */
const keys={},touch={},ptrs=new Map(),lit=new Set();
const playing=()=>PLAY.has(phase);
function refresh(){
 lit.forEach(e=>e.classList.remove('on'));lit.clear();
 for(const k in touch)touch[k]=0;
 ptrs.forEach(v=>{if(v){touch[v.k]=1;v.el.classList.add('on');lit.add(v.el)}});
}
function clearInput(){for(const k in keys)keys[k]=0;ptrs.clear();refresh()}
function hold(e){
 const el=document.elementFromPoint(e.clientX,e.clientY),b=el&&el.closest?el.closest('[data-k]'):null;
 ptrs.set(e.pointerId,b&&b.dataset.k?{k:b.dataset.k,el:b}:null);refresh();
}
function bindGroup(el,sg,kx,ky){
 let drag=null;
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(editing){try{el.setPointerCapture(e.pointerId)}catch(_){}drag={id:e.pointerId,x:e.clientX,y:e.clientY,a:cfg[kx],b:cfg[ky]};return}
  if(!playing())return;
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  hold(e);
 });
 el.addEventListener('pointermove',e=>{
  if(editing){
   if(!drag||drag.id!==e.pointerId)return;
   let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(rotd)[dx,dy]=[dy,-dx];
   cfg[kx]=drag.a+dx*sg;cfg[ky]=drag.b-dy;applyCfg();return;
  }
  if(ptrs.has(e.pointerId))hold(e);
 });
 const up=e=>{if(drag&&drag.id===e.pointerId)drag=null;if(ptrs.delete(e.pointerId))refresh()};
 ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,up));
}
bindGroup(dpEl,1,'dx','dy');bindGroup(fcEl,-1,'fx','fy');
addEventListener('keydown',e=>{
 keys[e.code]=1;
 if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
 if(e.repeat)return;
 if(e.code==='Escape'||e.code==='KeyP'){if(playing())pause();else if(phase==='paused')resume()}
 if(e.code==='Enter'&&phase==='select')confirmSel();
 if(e.code==='KeyM')toggleMute();
});
addEventListener('keyup',e=>{keys[e.code]=0});
addEventListener('blur',clearInput);
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();if(playing())pause();Snd.suspend()}else Snd.resume()});
const inp=()=>({l:!!(keys.KeyA||keys.ArrowLeft||touch.l),r:!!(keys.KeyD||keys.ArrowRight||touch.r),u:!!(keys.KeyW||keys.ArrowUp||touch.u),d:!!(keys.KeyS||keys.ArrowDown||touch.d),p:!!(keys.KeyJ||touch.p),t:!!(keys.KeyI||touch.t),k:!!(keys.KeyK||touch.k),o:!!(keys.KeyL||touch.o),b:!!(keys.KeyU||keys.ShiftLeft||keys.ShiftRight||touch.b)});

/* ===================== PERSONAJES Y ATAQUES ===================== */
/* a:[inicio activo, fin activo] sobre el contador t que baja desde n; r: alcance máximo (distancia a centro del rival); st: aturdimiento; kb: empuje */
const AT={
 p:{d:6,r:92,n:16,a:[12,7],h:1,st:13,kb:9},                 /* puño: rápido, corto de recuperación, golpe alto */
 t:{d:11,r:56,n:24,a:[17,10],h:1,st:22,kb:6,up:1},          /* gancho: lento, alto daño, lanza al rival hacia arriba */
 k:{d:13,r:108,n:28,a:[19,12],st:18,kb:17},                 /* patada: alcance largo, golpe medio */
 o:{d:8,r:104,n:23,a:[15,10],st:16,kb:8,low:1}};            /* barrida: golpe bajo, no toca rivales en el aire */
const ROSTER=[
 {n:'Kaede',desc:'Letal y equilibrada',col:'#14705f',dk:'#0a352e',belt:'#d9a62e',eye:'#7dffd9',vo:190,spd:4,pw:1,acc:'pony'},
 {n:'Ryuga',desc:'Fuerte, lento, implacable',col:'#8e1a12',dk:'#3d0e09',belt:'#c9c9c9',eye:'#ff4d2e',vo:120,spd:3.4,pw:1.25,acc:'spikes'},
 {n:'Sombra',desc:'Veloz y silenciosa',col:'#432a78',dk:'#1c1136',belt:'#8ad0ee',eye:'#c58bff',vo:210,spd:4.8,pw:.85,acc:'scarf'},
 {n:'Dragón Rojo',desc:'Brutal, sin piedad',col:'#5e0a14',dk:'#1d0306',belt:'#d9a62e',eye:'#ffb000',vo:95,spd:3.8,pw:1.1,acc:'horns'},
 {n:'Yuki',desc:'Ágil y mortal',col:'#2a6aa8',dk:'#122f50',belt:'#dcecf7',eye:'#bfeaff',vo:225,spd:4.4,pw:.95,acc:'crest'},
 {n:'Titán',desc:'Pesado e imparable',col:'#6e4515',dk:'#32200a',belt:'#1c1c1c',eye:'#ffe3a0',vo:80,spd:3.2,pw:1.35,acc:'bald',bw:1.15}];
const mk=(x,face,o)=>Object.assign({x,y:G,vy:0,face,hp:100,st:'idle',at:'p',t:0,hit:0,act:null,pi:{},buf:null,bt:0,cd:0,bs:0,wk:0,cr:false,blk:false,wd:[],skin:'#c99770',hide:0,dead:0,pool:0,lag:100,win:false},o);
const SEQS=[['d','f','p'],['f','f','k'],['d','d','o'],['d','f','t']];
const SYM={d:'↓',p:'□',t:'△',k:'✕',o:'○'};

/* ===================== AUDIO (Web Audio API, 100% sintetizado, sin archivos) ===================== */
const Snd=(()=>{
 let ac=null,out=null,mus=null,sfx=null,nb=null,muted=false,mode='off',step=0,next=0;
 try{muted=localStorage.getItem('furiaMute')==='1'}catch(e){}
 const BPM={menu:62,fight:118,tense:96};
 const N={D1:36.71,D2:73.42,Eb2:77.78,F2:87.31,G2:98,D3:146.83,Eb3:155.56,Ab3:207.65,A3:220,Bb3:233.08,C4:261.63,D4:293.66,Eb4:311.13};
 const ok=()=>!!ac&&!muted&&ac.state==='running';
 const T=()=>ac.currentTime;
 function init(){
  if(ac)return true;
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
  try{
   ac=new C();const comp=ac.createDynamicsCompressor();
   out=ac.createGain();out.gain.value=muted?0:.85;out.connect(comp);comp.connect(ac.destination);
   mus=ac.createGain();mus.gain.value=.5;mus.connect(out);
   sfx=ac.createGain();sfx.gain.value=.9;sfx.connect(out);
   nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
   setInterval(sched,30);
  }catch(e){ac=null;return false}
  return true;
 }
 function env(gn,t,a,pk,d){gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(pk,t+a);gn.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
 function osc(type,f0,f1,t,dur,vol,dest,a){
  const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(gn,t,a||.005,vol,dur);o.connect(gn);gn.connect(dest||sfx);o.start(t);o.stop(t+dur+.06);
 }
 function noise(t,dur,vol,ft,f0,f1,q,dest,a){
  const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),gn=ac.createGain();
  s.buffer=nb;fl.type=ft;fl.Q.value=q||1;fl.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(gn,t,a||.003,vol,dur);s.connect(fl);fl.connect(gn);gn.connect(dest||sfx);s.start(t,Math.random()*.5);s.stop(t+dur+.06);
 }
 function voice(pitch,dur,vol,glide){            /* gruñido/grito: diente de sierra + dos formantes + aire */
  const t=T(),o=ac.createOscillator(),f1=ac.createBiquadFilter(),f2=ac.createBiquadFilter(),gn=ac.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(pitch*glide,t);o.frequency.exponentialRampToValueAtTime(pitch*.7,t+dur);
  f1.type='bandpass';f1.frequency.value=750;f1.Q.value=5;f2.type='bandpass';f2.frequency.value=1250;f2.Q.value=6;
  env(gn,t,.02,vol,dur);o.connect(f1);o.connect(f2);f1.connect(gn);f2.connect(gn);gn.connect(sfx);o.start(t);o.stop(t+dur+.06);
  noise(t,dur*.8,vol*.35,'bandpass',1000,700,1);
 }
 /* --- instrumentos de la música --- */
 const kick=(t,v)=>{osc('sine',150,42,t,.22,.9*(v||1),mus,.002);noise(t,.02,.25*(v||1),'highpass',3000,3000,1,mus)};
 const taiko=(t,v)=>{osc('sine',95,36,t,.55,.9*(v||1),mus,.003);noise(t,.14,.4*(v||1),'lowpass',500,120,1,mus)};
 function bassn(f,t,d,v){
  const o=ac.createOscillator(),fl=ac.createBiquadFilter(),gn=ac.createGain();
  o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=420;fl.Q.value=3;
  env(gn,t,.01,v,d);o.connect(fl);fl.connect(gn);gn.connect(mus);o.start(t);o.stop(t+d+.06);
 }
 function pad(t,d,freqs,v){
  const fl=ac.createBiquadFilter(),gn=ac.createGain();fl.type='lowpass';fl.frequency.value=650;
  gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(v,t+d*.4);gn.gain.linearRampToValueAtTime(.0001,t+d);
  fl.connect(gn);gn.connect(mus);
  for(const f of freqs)for(const k of [1,1.005]){const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f*k;o.connect(fl);o.start(t);o.stop(t+d+.1)}
 }
 const bell=(t,f,v)=>[1,2.76,5.4].forEach((m,i)=>osc('sine',f*m,f*m*.999,t,1.6-i*.4,v/(i+1),mus,.003));
 const BASS=[N.D2,0,N.D2,0,N.D2,0,N.Eb2,0,N.D2,0,N.D2,N.D2,N.F2,0,N.Eb2,0];
 const LEAD=[0,0,0,0,N.D4,0,0,N.Eb4,0,0,N.D4,0,N.C4,0,0,0,0,0,0,0,N.Bb3,0,N.C4,0,N.A3,0,0,0,N.Eb4,0,N.D4,0];
 function play(s,t){
  const b=60/BPM[mode]/4;
  if(mode==='fight'){
   if(s%4===0)kick(t,s%16===0?1.1:.9);
   if(s===4||s===12||s===20||s===28)noise(t,.14,.35,'bandpass',1800,900,1.2,mus);
   if(BASS[s%16])bassn(BASS[s%16],t,b*1.7,.16);
   if(s%2===1)noise(t,.03,.05,'highpass',7000,7000,1,mus);
   if(s%16===0)pad(t,b*16,[N.D3,N.Ab3],.05);
   if(LEAD[s])osc('triangle',LEAD[s],LEAD[s],t,b*3,.07,mus,.01);
  }else if(mode==='menu'){
   if(s%16===0){pad(t,b*16,[N.D2,N.D3],.09);taiko(t,.8)}
   if(s%16===8)taiko(t,.5);
   if(s===6||s===22)bell(t,N.Eb4*2,.05);
  }else if(mode==='tense'){
   if(s%8===0)kick(t,.9);
   if(s%8===2)kick(t,.6);

/* ===================== COMBATE ===================== */
function connects(f,o){

 if(dx<-10||dx>A.r)return false;                  /* fuera de alcance o por la espalda */
 if(A.low&&o.y<G-25)return false;                 /* la barrida no toca a un rival en el aire */
 if(A.h&&o.cr)return false;                       /* los golpes altos pasan sobre un rival agachado */

}
function hurt(o,f,A){

 f.hit=1;
 if(bl){d=Math.max(1,Math.ceil(d*.15));o.x+=f.face*A.kb*.5;o.bs=8;sparks(o,'#8cf');Snd.block()}
 else{
  o.st='hit';o.t=A.st;o.cr=false;o.blk=false;o.bs=0;o.buf=null;o.x+=f.face*A.kb;shake=A.up?10:8;
  if(A.up)o.vy=-9;
  wound(o,d);blood?bloodBurst(o,f.face,d>9?34:20):sparks(o,'#ffb347');Snd.hit(d);if(Math.random()<.75)Snd.pain(o);
 }
 if(o.x<=40||o.x>=W-40)f.x-=f.face*A.kb*.6;        /* sin esquina infinita: el atacante retrocede */

}
function step(f,o,i){

 if(f.st==='hit'){if(--f.t<=0)f.st='idle'}
 else if(f.st==='atk'){
  const A=AT[f.at];f.t--;
  if(!f.hit&&f.t<=A.a[0]&&f.t>=A.a[1])f.act=A;
  if(f.t<=0){f.st='idle';f.cd=f.at==='k'?5:2}
 }else{
  if(f.bs>0)f.bs--;
  if(f.cd>0)f.cd--;
  f.cr=!!i.d&&!air;
  f.blk=!air&&!!(i.b||(f.face===1?i.l:i.r));
  if(!f.cr&&!i.b&&f.bs<=0){const m=f.spd||4;if(i.l)f.x-=m;if(i.r)f.x+=m;if(i.l||i.r)f.wk+=.28;if(i.u&&!air)f.vy=-13}
  if(f.buf&&!i.b&&f.bs<=0&&f.cd<=0&&!(air&&(f.buf==='t'||f.buf==='o'))){
   const k=f.buf;f.buf=null;f.st='atk';f.at=k;f.t=AT[k].n;f.hit=0;f.cr=k==='o';f.blk=false;Snd.swing(k);Snd.grunt(f);
  }

/* ===================== INTELIGENCIA ARTIFICIAL ===================== */
/* rx: reacción (frames) · blk: prob. de cubrirse · pun: castigar golpes fallidos · anti: anti-aéreo · agg: agresividad · cd: pausa entre ataques */
const AIP=[null,{rx:13,blk:.35,pun:.25,anti:.2,agg:.45,cd:44},{rx:9,blk:.55,pun:.5,anti:.5,agg:.65,cd:28},{rx:5,blk:.75,pun:.8,anti:.85,agg:.8,cd:16}];
function aiInit(){ais={seen:0,rx:0,thr:null,dec:false,blk:0,crb:false,pu:0,cd:30,last:'',rep:0,mode:'press',mt:0,want:70}}
function ai(){
 const v=AIP[E.lv]||AIP[1],i={},d=Math.abs(P.x-E.x),dir=P.x<E.x?'l':'r',back=dir==='l'?'r':'l';
 /* 1) defensa: detecta el ataque del jugador, reacciona tras un retraso y se cubre (agachado si es bajo) */
 if(P.st==='atk'){
  if(!ais.seen){ais.seen=1;ais.rx=v.rx+(Math.random()*6|0);ais.thr=AT[P.at];ais.dec=Math.random()<v.blk}
  else if(ais.rx>0&&--ais.rx===0&&ais.dec&&d<ais.thr.r+30){ais.blk=18;ais.crb=!!ais.thr.low}
 }else if(ais.seen){ais.seen=0;ais.rx=0;if(d<115&&Math.random()<v.pun)ais.pu=16}   /* castigo al terminar su ataque */
 if(ais.blk>0){ais.blk--;i.b=true;if(ais.crb)i.d=true;return i}
 if(E.st!=='idle'||E.bs>0)return i;
 if(ais.cd>0)ais.cd--;
 if(ais.pu>0)ais.pu--;
 /* 2) elección de ataque según distancia y estado del jugador, sin repetir el mismo más de dos veces */
 const pAir=P.y<G-30,cand=[];
 for(const k of 'ptko'){
  const A=AT[k];
  if(d>A.r*.92||d<8||(A.h&&P.cr)||(A.low&&pAir)||((k==='t'||k==='o')&&E.y<G))continue;
  let w={p:3,t:1,k:2,o:1.5}[k];
  if(k==='t'&&pAir)w*=8;
  if(k==='o'&&P.blk&&!P.cr)w*=5;
  if(k==='o'&&P.cr)w*=2;
  if(k==='k'&&d>70)w*=2;
  if(k===ais.last)w*=ais.rep>=2?.05:.5;
  cand.push([k,w]);
 }
 const may=ais.pu>0||(pAir&&Math.random()<v.anti*.3)||(ais.cd<=0&&Math.random()<.16+v.agg*.12);
 if(cand.length&&may){
  let r=Math.random()*cand.reduce((s,x)=>s+x[1],0),k=cand[0][0];
  for(const x of cand){if((r-=x[1])<=0){k=x[0];break}}
  i[k]=true;ais.rep=k===ais.last?ais.rep+1:1;ais.last=k;ais.cd=v.cd+(Math.random()*20|0);ais.pu=0;
  ais.mode=Math.random()<v.agg?'press':'back';ais.mt=14+(Math.random()*16|0);ais.want=40+(Math.random()*50|0);
  return i;
 }
 /* 3) movimiento con propósito: acercarse, mantener distancia tras atacar o cubrirse */
 if(ais.mt>0)ais.mt--;
 if(d>105){i[dir]=true;if(d>200&&E.y>=G&&Math.random()<.008)i.u=true}
 else if(ais.cd>0&&ais.mode==='back'&&ais.mt>0&&E.x>70&&E.x<W-70)i[back]=true;
 else if(d>ais.want)i[dir]=true;
 return i;
}

}
function update(){

  if(phase==='intro')big(pt>45?(sd?'RONDA DECISIVA':'RONDA '+round):'¡PELEEN!',66,205,null,pt>45?0:4);

  if(phase==='fin'){
   big('¡REMÁTALO!',60,125,'#ff3b30',4);
   const fw=P.face===1?'→':'←';
   g.font='48px system-ui,sans-serif';g.textAlign='center';
   seq.forEach((k,n)=>{g.fillStyle=n<idx?'#e8c35a':(n===idx&&fail>0?'#ff3b30':'rgba(255,255,255,.88)');g.fillText(k==='f'?fw:SYM[k],W/2+(n-(seq.length-1)/2)*70,190)});
   g.fillStyle='#c8261c';g.fillRect(250,210,300*pt/300,8);
   big('EJECUTA LA SECUENCIA',24,252,'#e8dfc8');
  }
  if(phase==='fx'&&ft>50)big('¡REMATE FINAL!',58,170,'#ff3b30',5);
 }
 if(flash>.02){g.fillStyle='rgba(255,255,255,'+flash+')';g.fillRect(-20,-20,W+40,H+40)}
 g.restore();
}
